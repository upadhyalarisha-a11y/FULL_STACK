<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Card Layout</title>
  <style>
    .container {
      border: 1px solid black;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      padding: 3%;
      column-gap: 3%;
      flex-wrap: wrap;  
    }
    .card {
        flex: 1;
        border: 1px solid black;
        border-radius: 10px;
        padding: 3%;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 1);
        min-width: 200px;
        margin : 3% 0 0 0;

    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
        <h1>One</h1>
        <p>no.one in world is you.</p>
    </div>
    <div class="card">
        <h1>Two</h1>
        <p>no.two in the world is you.</p>
    </div>
    <div class="card">
        <h1>Three</h1>
    <p>no.three in the world is you.</p>
    </div>
  </div>
</body>
</html>

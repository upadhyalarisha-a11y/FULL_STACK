<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Bento Layout</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f4f4f4;
            padding:30px;
        }

        .container{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            grid-template-rows:repeat(4,180px);
            gap:20px;
        }

        .card{
            background:white;
            border:2px solid black;
            border-radius:15px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:24px;
            font-weight:bold;
            box-shadow:0 5px 10px rgba(0,0,0,0.2);
        }

        /* Different card sizes */

        .card1{
            grid-column:1 / 3;
            grid-row:1 / 3;
        }

        .card2{
            grid-column:3 / 5;
            grid-row:1 / 2;
        }

        .card3{
            grid-column:3 / 4;
            grid-row:2 / 4;
        }

        .card4{
            grid-column:4 / 5;
            grid-row:2 / 3;
        }

        .card5{
            grid-column:1 / 2;
            grid-row:3 / 5;
        }

        .card6{
            grid-column:2 / 4;
            grid-row:3 / 5;
        }

        .card7{
            grid-column:4 / 5;
            grid-row:3 / 5;
        }

        /* Responsive */

        @media (max-width:768px){

            .container{
                grid-template-columns:1fr;
                grid-template-rows:auto;
            }

            .card{
                grid-column:auto !important;
                grid-row:auto !important;
                height:180px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <div class="card card1">Card 1</div>
    <div class="card card2">Card 2</div>
    <div class="card card3">Card 3</div>
    <div class="card card4">Card 4</div>
    <div class="card card5">Card 5</div>
    <div class="card card6">Card 6</div>
    <div class="card card7">Card 7</div>

</div>

</body>
</html>

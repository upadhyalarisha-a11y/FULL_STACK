<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Diwali Door — Happy Diwali</title>
  <style>
    :root{--bg:#070712;--wood1:#3b1f0f;--wood2:#5a2e16;--gold:#ffd166}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}
    body{display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#14202b 0%, #071018 35%, #030406 100%);color:white}

    .stage{width:min(880px,92vw);aspect-ratio:16/9;position:relative;display:grid;place-items:center}

    /* door */
    .door-wrap{width:72%;height:84%;position:relative;perspective:1200px}
    .door{width:100%;height:100%;position:relative;border-radius:18px;overflow:visible}
    .panel{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(180deg,var(--wood2),var(--wood1));box-shadow:inset 0 6px 0 rgba(255,255,255,0.03),0 30px 60px rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700}
    .panel.left{left:0;border-top-left-radius:18px;border-bottom-left-radius:18px;transform-origin:left center}
    .panel.right{right:0;border-top-right-radius:18px;border-bottom-right-radius:18px;transform-origin:right center}

    /* handle / embellishment */
    .handle{width:10px;height:40px;background:linear-gradient(90deg,#c98,#8a3);border-radius:6px;box-shadow:0 6px 10px rgba(0,0,0,0.4)}

    /* reveal area (inside) */
    .inner{position:absolute;inset:6% 6% 6% 6%;border-radius:12px;background:radial-gradient(circle at 50% 30%, rgba(255,210,120,0.06), rgba(0,0,0,0.15));display:grid;place-items:center}

    /* diya */
    .diya{width:180px;height:180px;display:grid;place-items:end;margin-bottom:36px;opacity:0;transform:translateY(20px) scale(.9);transition:all 700ms cubic-bezier(.2,.9,.2,1);}
    .lamp{width:120px;height:80px;border-radius:60px 60px 20px 20px;background:linear-gradient(180deg,#a04000,#6b2a00);box-shadow:0 12px 30px rgba(255,150,50,0.18), inset 0 -8px 18px rgba(0,0,0,0.5);position:relative;display:block}
    .flame{position:absolute;left:50%;top:8%;width:36px;height:64px;background:radial-gradient(circle at 40% 30%,#fff8c6 0%, #ffd166 20%, #ff8a00 60%, rgba(255,90,0,0.8) 100%);border-radius:50% 50% 20% 20%;transform:translateX(-50%) scale(0.8);filter:drop-shadow(0 18px 30px rgba(255,140,30,0.35));animation:flame 900ms infinite alternate}
    @keyframes flame{from{transform:translateX(-50%) scale(0.9)}to{transform:translateX(-50%) scale(1.05)}}

    .glow{position:absolute;left:50%;top:44%;width:220px;height:120px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(closest-side,#ffd77a66 0%, #ffb24a33 30%, transparent 70%);opacity:0;transition:opacity 600ms}

    .message{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);font-size:clamp(20px,4vw,40px);font-weight:800;letter-spacing:1px;opacity:0;transform-origin:center;transition:all 700ms ease}
    .message .rain{background:linear-gradient(90deg,#ff4b4b,#ff9f1c,#ffd166,#6ee7b7,#60a5fa,#8b5cf6,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}

    /* open/closed states */
    .open .panel.left{transform:rotateY(-110deg)}
    .open .panel.right{transform:rotateY(110deg)}
    .open .diya{opacity:1;transform:translateY(0) scale(1)}
    .open .glow{opacity:1}
    .open .message{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

    /* closed initial */
    .panel{transition:transform 900ms cubic-bezier(.2,.9,.2,1)}
    .message{transform:translateX(-50%) translateY(24px) scale(.96)}

    /* play button */
    .replay{position:absolute;top:10px;right:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);padding:6px 10px;border-radius:8px;color:#fff;cursor:pointer}

    @media (max-width:520px){.diya{width:120px;height:120px;margin-bottom:22px}.lamp{width:84px;height:60px}.glow{width:160px;height:90px}.message{font-size:20px}.door-wrap{width:86%}}
  </style>
</head>
<body>
  <div class="stage">
    <div class="door-wrap" id="doorWrap" aria-live="polite">
      <button class="replay" id="replayBtn" aria-label="Open door">Open Door</button>
      <div class="door" id="door">
        <div class="panel left">
          <div class="handle" aria-hidden="true"></div>
        </div>
        <div class="panel right">
          <div class="handle" aria-hidden="true"></div>
        </div>

        <div class="inner" aria-hidden="false">
          <div class="glow" id="glow"></div>
          <div class="diya" id="diya" aria-hidden="true">
            <div class="lamp"></div>
            <div class="flame" aria-hidden="true"></div>
          </div>
          <div class="message" id="msg" aria-hidden="true"><span class="rain">Happy Diwali</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const doorWrap = document.getElementById('doorWrap');
    const door = document.getElementById('door');
    const replay = document.getElementById('replayBtn');
    const diya = document.getElementById('diya');
    const msg = document.getElementById('msg');

    function openSequence(){
      // add open class to reveal diya after short delay
      door.classList.add('open');
      // mark accessible text
      diya.setAttribute('aria-hidden','false');
      msg.setAttribute('aria-hidden','false');
    }

    function resetSequence(){
      door.classList.remove('open');
      diya.setAttribute('aria-hidden','true');
      msg.setAttribute('aria-hidden','true');
    }

    // open automatically after a small delay
    window.addEventListener('load', () => {
      setTimeout(openSequence, 700);
    });

    // replay button toggles
    replay.addEventListener('click', () => {
      resetSequence();
      // small reflow and reopen
      requestAnimationFrame(()=> requestAnimationFrame(openSequence));
    });

    // allow tapping the door area to open/close for mobile
    door.addEventListener('click', (e)=>{
      if(door.classList.contains('open')) resetSequence(); else openSequence();
    });
  </script>
</body>
</html>

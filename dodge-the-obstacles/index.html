<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge the Obstacles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🚗 Dodge the Obstacles</h1>

        <div class="scoreboard">
            <span>Score: <b id="score">0</b></span>
            <span>Time: <b id="time">0</b>s</span>
            <span>Speed: <b id="speed">1</b>x</span>
        </div>

        <div id="gameArea">
            <div class="lane-line line-one"></div>
            <div class="lane-line line-two"></div>

            <div id="player">🚗</div>

            <div id="overlay">
                <h2 id="message">Ready?</h2>
                <button id="startBtn">Start Game</button>
            </div>
        </div>

        <p>Use ← → arrow keys or A / D to change lanes.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .container {
                display: flex;
                flex-direction:column;
                outline: 1px solid black;
                font-size: 30px;
                text-align: center;
                background-color: rgb(103, 231, 240);
            }
            .container>div{
                outline: 1px dashed black;
                flex-basis:100px;
            }
            .container>div:nth-child(odd){
                background-color: beige;
            }
            #box1{
                flex-grow:3;
            }
            #box2, #box3, #box4, #box5, #box6{
                flex-grow:1;
            }            
        </style>
    </head>
    <body>
        <div class="container">
            <div id="box1">1</div>
            <div id="box2">2</div>
            <div id="box3">3</div>
            <div id="box4">4</div>
            <div id="box5">5</div>
            <div id="box6">6</div>
        </div>
    </body>
</html>

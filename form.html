<!DOCTYPE html>
<head>
    <meta charset="UTD-8">
    <meta name = ""viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*         
        :enabled;
        :disabled;
        :valid;
        :invalid;
        :required;
        :optional;
        :in-range;
        :out-of-range;
        :placeholder-shown;
        :checked;
        */
        input{
            margin: 3px;
            border-width: 0 0 2px 0;
            border-color: blue;
        }
        input:required{
            font-family:Arial;
        }
        input:optional{
            font-family:Montana;
        }
        input:valid{
            color:green;
        }
        input:invalid{
            color: red;
        }
        input:enabled{
            color: black;
            background-color: lightgrey;
        }
        input:disabled{
            border-width: 0px;
            color:white;
            background-color: black;
        }
        input:in-range{
            font-weight:900;
        }
        input:out-of-range{
            font-size:30px;
        }
        input:checked{
            box-shadow: 3px 3px 0 black;
        }
        input:placeholder-shown{
            font-size: 20px;
        }
        input:read-only{
            background-color: transparent;
            border-width: 0px;
        }
        input:read-write{
            box-shadow: 3px 3px 0 black;
        }
    </style>
</head>
<body>
    <form>
        <input type="text" placeholder="First Name" required><br/><br/>
        <input type="text" placeholder="Middle Name" optional><br/><br/>
        <input type="text" placeholder="Last Name" required><br/><br/>
        <input type="email" placeholder="Email" required><br/><br/>
        <input type="number" placeholder="Age" ><br/><br/>
        <input type="text" placeholder="Mathura" disabled><br/><br/>
    </form>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1, .box2, .box3{
            width: 300px;
            height: 300px;
        }
        .box1{ 
            background: linear-gradient(rgb(81, 21, 21) , rgb(182, 212, 31))
        }
        .box2{
            background: radial-gradient(rgb(104, 180, 59) , rgb(93, 93, 186))
        }
        .box3{
            background: conic-gradient(rgb(207, 88, 161) , rgb(88, 70, 6))
        }
    </style>
</head>
<body>
    <p>Linear Gradient</p>
    <div class="box1"></div>
    <p>Radial gradient</p>
    <div class="box2"></div>
    <p>Conic Gradient</p>
    <div class="box3"></div>
    
</body>
</html>

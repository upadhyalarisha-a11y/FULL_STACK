<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Day</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px 40px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
        }

        p {
            color: #f61616;
            font-family: Arial;
            font-size: 30px;
            font-weight: 1000;
            font-style: italic;
            text-align: center;
            text-transform: none;
            text-decoration: underline;
            text-shadow: 5px 1px 2px rgba(9, 9, 9, 0.1);
            word-spacing: 2px;
            white-space: normal;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>This is a paragraph.</p>
    </div>

</body>
</html>

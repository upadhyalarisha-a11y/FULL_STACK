<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donut Chart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 200px;
            height: 200px;
        }
        svg {
            width: 100%;
            height: 100%;;
            transform: rotate(-90deg);
        }
        .percentage-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: #64c8ff;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 100 100">
            <!-- Background circle (black) -->
            <circle cx="50" cy="50" r="45" fill="none" stroke="#000000" stroke-width="8"/>
            <!-- Donut circle (87% blue) -->
            <circle 
                cx="50" 
                cy="50" 
                r="45" 
                fill="none" 
                stroke="#64c8ff" 
                stroke-width="8"
                stroke-dasharray="245.04 361.05"
                stroke-linecap="round"
            />
        </svg>
        <div class="percentage-text">87%</div>
    </div>
</body>
</html>

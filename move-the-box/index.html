<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move the Box</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Move the Box 🎮</h1>
        <p>Reach the green goal using arrow keys or WASD.</p>

        <div class="info">
            <span>⌨️ Use Arrow Keys / WASD</span>
            <span id="status">Find the goal!</span>
        </div>

        <div id="gameArea">
            <div id="player"></div>
            <div id="goal"></div>
        </div>

        <button id="resetBtn">↻ Restart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

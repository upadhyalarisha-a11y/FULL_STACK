<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Product Cards</title>
  <style>
    .container {
      border: 1px solid black;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      padding: 3%;
      column-gap: 3%;
      flex-wrap: wrap;  
    }
    .card {
        flex: 1;
        border: 1px solid black;
        border-radius: 10px;
        padding: 3%;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 1);
        min-width: 200px;
        margin : 3% 0 0 0;

    }
    </style>
</head>
<body>
  <div class="container">
    <div class="card">
        <h1>Product One</h1>
        <p>Product one description.</p>
    </div>
    <div class="card">
        <h1>Product Two</h1>
        <p>Product two description.</p>
    </div>
    <div class="card">
        <h1>Product Three</h1>
        <p>Product three description.</p>
    </div>
     <div class="card">
        <h1>Product four</h1>
        <p>Product four description.</p>
    </div>
     <div class="card">
        <h1>Product five</h1>
        <p>Product five description.</p>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 14px 6%;
            background-color: #000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .brand-symbol {
            color: #38bdf8;
            font-size: 28px;
        }

        .menu-toggle {
            display: none;
        }

        .menu-button {
            display: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .login-button {
            padding: 9px 18px;
            color: white !important;
            background-color: #2563eb;
            border-radius: 4px;
        }

        .login-button:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 650px) {
            .navbar {
                flex-wrap: wrap;
            }

            .menu-button {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                gap: 0;
                text-align: center;
            }

            .nav-links li {
                padding: 12px 0;
                border-top: 1px solid #333;
            }

            .menu-toggle:checked ~ .nav-links {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="#home">
            <span class="brand-symbol" aria-hidden="true">&#9733;</span>
            <span>TechNova</span>
        </a>

        <label class="menu-button" for="menu-toggle" aria-label="Toggle navigation menu">&#9776;</label>
        <input class="menu-toggle" type="checkbox" id="menu-toggle">

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#content">Content</a></li>
            <li><a class="login-button" href="login.html">Login</a></li>
        </ul>
    </nav>
</body>
</html>

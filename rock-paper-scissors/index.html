<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>

    <div class="container">
        <h1>Rock Paper Scissors ✊</h1>

        <p>First player to score 5 points wins!</p>

        <div class="choices">
            <button class="choice" data-choice="rock">✊ Rock</button>
            <button class="choice" data-choice="paper">✋ Paper</button>
            <button class="choice" data-choice="scissors">✌️ Scissors</button>
        </div>

        <h2 id="result">Make your move!</h2>

        <p id="computerChoice">Computer: Waiting...</p>

        <div class="score">
            <h3>Your Score: <span id="playerScore">0</span></h3>
            <h3>Computer Score: <span id="computerScore">0</span></h3>
        </div>

        <h2 id="winner"></h2>

        <button id="playAgain" hidden>Play Again</button>
    </div>

    <script src="./index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Web Page</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      
      margin: 0;
      padding: 40px;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .hero-image {
      max-width: 250px;
      width: 100%;
      height: auto;
      margin-bottom: 30px;
      border-radius: 12px;
      border: 3px solid #fff;
    }

    h2 {
      color: yellowgreen;
      margin-bottom: 20px;
    }
    p {
      max-width: 700px;
      background: yellow;
      color: black;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <img class="hero-image" src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='250' height='250' viewBox='0 0 250 250'%3E%3Crect width='250' height='250' fill='%23ffcc00' /%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='28' fill='%23000'%3EIMAGE%3C/text%3E%3C/svg%3E" alt="Sample image">
  <h2>Heading</h2>
  <p>This is a simple web page with a heading and a paragraph. It uses plain HTML and minimal styling to keep the layout clean and easy to read.</p>
</body>
</html>
